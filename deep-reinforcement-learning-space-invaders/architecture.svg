<polyline points="350.0,268.0 380.0,268.0" fill="none" stroke="#555" stroke-width="1.6" marker-end="url(#ar)"/>
<polyline points="600.0,276.5 585.0,276.5 585.0,268.0 570.0,268.0" fill="none" stroke="#555" stroke-width="1.6" marker-end="url(#ar)"/>
<polyline points="475.0,240.0 475.0,133.0" fill="none" stroke="#555" stroke-width="1.6" marker-end="url(#ar)"/>
<text x="481.0" y="186.5" text-anchor="start" font-size="11" fill="#555">update weights</text>
<rect x="20" y="60" width="140" height="56" rx="9" fill="#E8F0FE" stroke="#4C78C9" stroke-width="1.8"/>
<text x="90.0" y="80" text-anchor="middle" font-size="13" font-weight="bold" fill="#1F2937">Game</text>
<text x="90.0" y="97" text-anchor="middle" font-size="13" fill="#1F2937">Gymnasium + ALE</text>
<rect x="190" y="60" width="160" height="73" rx="9" fill="#F1F3F4" stroke="#7A8791" stroke-width="1.8"/>
<text x="270.0" y="80" text-anchor="middle" font-size="13" font-weight="bold" fill="#1F2937">Preprocess</text>
<text x="270.0" y="97" text-anchor="middle" font-size="13" fill="#1F2937">grayscale, 84×84,</text>
<text x="270.0" y="114" text-anchor="middle" font-size="13" fill="#1F2937">stack of 4 frames</text>
<rect x="380" y="60" width="190" height="73" rx="9" fill="#E3F4EF" stroke="#2E8B77" stroke-width="1.8"/>
<text x="475.0" y="80" text-anchor="middle" font-size="13" font-weight="bold" fill="#1F2937">Policy network</text>
<text x="475.0" y="97" text-anchor="middle" font-size="13" fill="#1F2937">3 conv layers +</text>
<text x="475.0" y="114" text-anchor="middle" font-size="13" fill="#1F2937">512-unit dense layer</text>
<rect x="600" y="60" width="140" height="56" rx="9" fill="#E3F4EF" stroke="#2E8B77" stroke-width="1.8"/>
<text x="670.0" y="80" text-anchor="middle" font-size="13" font-weight="bold" fill="#1F2937">Q-value for</text>
