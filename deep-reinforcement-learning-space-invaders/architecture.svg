<rect x="190" y="240" width="160" height="56" rx="9" fill="#F1F3F4" stroke="#7A8791" stroke-width="1.8"/>
<text x="270.0" y="260" text-anchor="middle" font-size="13" font-weight="bold" fill="#1F2937">Random</text>
<text x="270.0" y="277" text-anchor="middle" font-size="13" fill="#1F2937">mini-batch</text>
<rect x="380" y="240" width="190" height="56" rx="9" fill="#E3F4EF" stroke="#2E8B77" stroke-width="1.8"/>
<text x="475.0" y="260" text-anchor="middle" font-size="13" font-weight="bold" fill="#1F2937">TD loss</text>
<text x="475.0" y="277" text-anchor="middle" font-size="13" fill="#1F2937">policy Q vs target Q</text>
<rect x="600" y="240" width="160" height="73" rx="9" fill="#E3F4EF" stroke="#2E8B77" stroke-width="1.8"/>
<text x="680.0" y="260" text-anchor="middle" font-size="13" font-weight="bold" fill="#1F2937">Target network</text>
<text x="680.0" y="277" text-anchor="middle" font-size="13" fill="#1F2937">periodic copy of</text>
<text x="680.0" y="294" text-anchor="middle" font-size="13" fill="#1F2937">the policy network</text>
<text x="480" y="385" text-anchor="middle" font-size="12" font-style="italic" fill="#444">Replay and a separate target network keep training stable. Epsilon decays linearly to 0.01 in the best configuration.</text>
</svg>