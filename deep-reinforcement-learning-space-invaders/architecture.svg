<text x="855.0" y="80" text-anchor="middle" font-size="13" font-weight="bold" fill="#1F2937">Epsilon-greedy</text>
<text x="855.0" y="97" text-anchor="middle" font-size="13" fill="#1F2937">choice of action</text>
<rect x="20" y="240" width="140" height="56" rx="9" fill="#F1F3F4" stroke="#7A8791" stroke-width="1.8"/>
