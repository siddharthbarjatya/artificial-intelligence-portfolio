<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs>
<rect width="960" height="470" fill="#ffffff"/>
<text x="480.0" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#1F2937">Computer vision: one flower dataset, three tasks</text>
<polyline points="150.0,218.0 170.0,218.0 170.0,88.0 190.0,88.0" fill="none" stroke="#555" stroke-width="1.6" marker-end="url(#ar)"/>
<polyline points="400.0,88.0 430.0,88.0" fill="none" stroke="#555" stroke-width="1.6" marker-end="url(#ar)"/>
<polyline points="600.0,88.0 620.0,88.0 620.0,96.5 640.0,96.5" fill="none" stroke="#555" stroke-width="1.6" marker-end="url(#ar)"/>
<polyline points="150.0,218.0 190.0,218.0" fill="none" stroke="#555" stroke-width="1.6" marker-end="url(#ar)"/>
<polyline points="400.0,218.0 430.0,218.0" fill="none" stroke="#555" stroke-width="1.6" marker-end="url(#ar)"/>
<polyline points="600.0,218.0 640.0,218.0" fill="none" stroke="#555" stroke-width="1.6" marker-end="url(#ar)"/>
<polyline points="150.0,218.0 170.0,218.0 170.0,348.0 190.0,348.0" fill="none" stroke="#555" stroke-width="1.6" marker-end="url(#ar)"/>
<polyline points="340.0,348.0 355.0,348.0 355.0,356.5 370.0,356.5" fill="none" stroke="#555" stroke-width="1.6" marker-end="url(#ar)"/>
<polyline points="600.0,356.5 615.0,356.5 615.0,348.0 630.0,348.0" fill="none" stroke="#555" stroke-width="1.6" marker-end="url(#ar)"/>
<polyline points="760.0,348.0 790.0,348.0" fill="none" stroke="#555" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="20" y="190" width="130" height="56" rx="9" fill="#E8F0FE" stroke="#4C78C9" stroke-width="1.8"/>
<text x="85.0" y="210" text-anchor="middle" font-size="13" font-weight="bold" fill="#1F2937">Flower</text>
<text x="85.0" y="227" text-anchor="middle" font-size="13" fill="#1F2937">images</text>
<rect x="190" y="60" width="210" height="56" rx="9" fill="#E3F4EF" stroke="#2E8B77" stroke-width="1.8"/>
<text x="295.0" y="80" text-anchor="middle" font-size="13" font-weight="bold" fill="#1F2937">VGG16-style CNN</text>
<text x="295.0" y="97" text-anchor="middle" font-size="13" fill="#1F2937">5 conv blocks + batch norm</text>
<rect x="430" y="60" width="170" height="56" rx="9" fill="#E3F4EF" stroke="#2E8B77" stroke-width="1.8"/>
<text x="515.0" y="80" text-anchor="middle" font-size="13" font-weight="bold" fill="#1F2937">3 dense layers</text>
<text x="515.0" y="97" text-anchor="middle" font-size="13" fill="#1F2937">with dropout</text>
<rect x="640" y="60" width="170" height="73" rx="9" fill="#FDF1DC" stroke="#C98A1B" stroke-width="1.8"/>
<text x="725.0" y="80" text-anchor="middle" font-size="13" font-weight="bold" fill="#1F2937">Class prediction</text>
<text x="725.0" y="97" text-anchor="middle" font-size="13" fill="#1F2937">daisy-like, thistle,</text>
<text x="725.0" y="114" text-anchor="middle" font-size="13" fill="#1F2937">tubular, rose</text>
<rect x="190" y="190" width="210" height="56" rx="9" fill="#E3F4EF" stroke="#2E8B77" stroke-width="1.8"/>
<text x="295.0" y="210" text-anchor="middle" font-size="13" font-weight="bold" fill="#1F2937">U-Net</text>
<text x="295.0" y="227" text-anchor="middle" font-size="13" fill="#1F2937">residual blocks, 64×64</text>
<rect x="430" y="190" width="170" height="56" rx="9" fill="#E3F4EF" stroke="#2E8B77" stroke-width="1.8"/>
<text x="515.0" y="210" text-anchor="middle" font-size="13" font-weight="bold" fill="#1F2937">Pixel-wise</text>
<text x="515.0" y="227" text-anchor="middle" font-size="13" fill="#1F2937">prediction</text>
<rect x="640" y="190" width="170" height="56" rx="9" fill="#FDF1DC" stroke="#C98A1B" stroke-width="1.8"/>
<text x="725.0" y="210" text-anchor="middle" font-size="13" font-weight="bold" fill="#1F2937">Segmentation mask</text>
<text x="725.0" y="227" text-anchor="middle" font-size="13" fill="#1F2937">flower vs background</text>
<rect x="190" y="320" width="150" height="56" rx="9" fill="#F1F3F4" stroke="#7A8791" stroke-width="1.8"/>
<text x="265.0" y="340" text-anchor="middle" font-size="13" font-weight="bold" fill="#1F2937">Add noise</text>
<text x="265.0" y="357" text-anchor="middle" font-size="13" fill="#1F2937">200-step schedule</text>
<rect x="370" y="320" width="230" height="73" rx="9" fill="#E3F4EF" stroke="#2E8B77" stroke-width="1.8"/>
<text x="485.0" y="340" text-anchor="middle" font-size="13" font-weight="bold" fill="#1F2937">Same U-Net, denoising mode</text>
<text x="485.0" y="357" text-anchor="middle" font-size="13" fill="#1F2937">timestep embeddings +</text>
<text x="485.0" y="374" text-anchor="middle" font-size="13" fill="#1F2937">group normalisation</text>
<rect x="630" y="320" width="130" height="56" rx="9" fill="#E3F4EF" stroke="#2E8B77" stroke-width="1.8"/>
<text x="695.0" y="340" text-anchor="middle" font-size="13" font-weight="bold" fill="#1F2937">Predicted</text>
<text x="695.0" y="357" text-anchor="middle" font-size="13" fill="#1F2937">noise</text>
<rect x="790" y="320" width="150" height="56" rx="9" fill="#FDF1DC" stroke="#C98A1B" stroke-width="1.8"/>
<text x="865.0" y="340" text-anchor="middle" font-size="13" font-weight="bold" fill="#1F2937">New flower images</text>
<text x="865.0" y="357" text-anchor="middle" font-size="13" fill="#1F2937">reverse denoising</text>
<text x="190" y="50" text-anchor="start" font-size="13" fill="#444">1  Classification</text>
<text x="190" y="180" text-anchor="start" font-size="13" fill="#444">2  Segmentation</text>
<text x="190" y="310" text-anchor="start" font-size="13" fill="#444">3  Generation (diffusion)</text>
</svg>