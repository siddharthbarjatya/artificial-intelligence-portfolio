<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" width="960" height="430" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs>
<rect width="960" height="430" fill="#ffffff"/>
<text x="480.0" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#1F2937">BM25 search engine in R: index once, search many times</text>
<polyline points="150.0,94.0 165.0,94.0 165.0,111.0 180.0,111.0" fill="none" stroke="#555" stroke-width="1.6" marker-end="url(#ar)"/>
<polyline points="380.0,111.0 395.0,111.0 395.0,94.0 410.0,94.0" fill="none" stroke="#555" stroke-width="1.6" marker-end="url(#ar)"/>
<polyline points="560.0,94.0 575.0,94.0 575.0,102.5 590.0,102.5" fill="none" stroke="#555" stroke-width="1.6" marker-end="url(#ar)"/>
<polyline points="685.0,139.0 685.0,164.5 645.0,164.5 645.0,190.0" fill="none" stroke="#555" stroke-width="1.6" marker-end="url(#ar)"/>
<polyline points="685.0,139.0 685.0,164.5 850.0,164.5 850.0,190.0" fill="none" stroke="#555" stroke-width="1.6" marker-end="url(#ar)"/>
<polyline points="150.0,353.0 175.0,353.0 175.0,357.0 200.0,357.0" fill="none" stroke="#555" stroke-width="1.6" marker-end="url(#ar)"/>
<polyline points="540.0,357.0 640.0,357.0 640.0,361.5 740.0,361.5" fill="none" stroke="#555" stroke-width="1.6" marker-end="url(#ar)"/>
<polyline points="645.0,246.0 645.0,279.0 370.0,279.0 370.0,312.0" fill="none" stroke="#555" stroke-width="1.6" marker-end="url(#ar)"/>
<polyline points="850.0,263.0 850.0,287.5 430.0,287.5 430.0,312.0" fill="none" stroke="#555" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="20" y="66" width="130" height="56" rx="9" fill="#E8F0FE" stroke="#4C78C9" stroke-width="1.8"/>
<text x="85.0" y="86" text-anchor="middle" font-size="13" font-weight="bold" fill="#1F2937">wsj.xml</text>
<text x="85.0" y="103" text-anchor="middle" font-size="13" fill="#1F2937">170,000+ articles</text>
<rect x="180" y="66" width="200" height="90" rx="9" fill="#F1F3F4" stroke="#7A8791" stroke-width="1.8"/>
<text x="280.0" y="86" text-anchor="middle" font-size="13" font-weight="bold" fill="#1F2937">Parser.R</text>
<text x="280.0" y="103" text-anchor="middle" font-size="13" fill="#1F2937">lowercase, strip tags,</text>
<text x="280.0" y="120" text-anchor="middle" font-size="13" fill="#1F2937">split by article ID,</text>
<text x="280.0" y="137" text-anchor="middle" font-size="13" fill="#1F2937">tokenise</text>
<rect x="410" y="66" width="150" height="56" rx="9" fill="#F1F3F4" stroke="#7A8791" stroke-width="1.8"/>
<text x="485.0" y="86" text-anchor="middle" font-size="13" font-weight="bold" fill="#1F2937">wsj_parsed.txt</text>
<text x="485.0" y="103" text-anchor="middle" font-size="13" fill="#1F2937">tokens per article</text>
<rect x="590" y="66" width="190" height="73" rx="9" fill="#E3F4EF" stroke="#2E8B77" stroke-width="1.8"/>
<text x="685.0" y="86" text-anchor="middle" font-size="13" font-weight="bold" fill="#1F2937">Indexer.R</text>
<text x="685.0" y="103" text-anchor="middle" font-size="13" fill="#1F2937">TF, DF, IDF = log(N/df),</text>
<text x="685.0" y="120" text-anchor="middle" font-size="13" fill="#1F2937">sorted vocabulary</text>
<rect x="560" y="190" width="170" height="56" rx="9" fill="#FDF1DC" stroke="#C98A1B" stroke-width="1.8"/>
<text x="645.0" y="210" text-anchor="middle" font-size="13" font-weight="bold" fill="#1F2937">postings.bin</text>
<text x="645.0" y="227" text-anchor="middle" font-size="13" fill="#1F2937">[DocID, TF] pairs</text>
<rect x="760" y="190" width="180" height="73" rx="9" fill="#FDF1DC" stroke="#C98A1B" stroke-width="1.8"/>
<text x="850.0" y="210" text-anchor="middle" font-size="13" font-weight="bold" fill="#1F2937">metadata files</text>
<text x="850.0" y="227" text-anchor="middle" font-size="13" fill="#1F2937">IDF, byte offset, size,</text>
<text x="850.0" y="244" text-anchor="middle" font-size="13" fill="#1F2937">doc lengths</text>
<rect x="20" y="325" width="130" height="56" rx="9" fill="#E8F0FE" stroke="#4C78C9" stroke-width="1.8"/>
<text x="85.0" y="345" text-anchor="middle" font-size="13" font-weight="bold" fill="#1F2937">query.in</text>
<text x="85.0" y="362" text-anchor="middle" font-size="13" fill="#1F2937">keywords</text>
<rect x="200" y="312" width="340" height="90" rx="9" fill="#E3F4EF" stroke="#2E8B77" stroke-width="1.8"/>
<text x="370.0" y="332" text-anchor="middle" font-size="13" font-weight="bold" fill="#1F2937">Searcher.R</text>
<text x="370.0" y="349" text-anchor="middle" font-size="13" fill="#1F2937">seek to each term&#x27;s bytes in postings.bin,</text>
<text x="370.0" y="366" text-anchor="middle" font-size="13" fill="#1F2937">BM25 score (k1 = 1.2, b = 0.75),</text>
<text x="370.0" y="383" text-anchor="middle" font-size="13" fill="#1F2937">keep articles containing all terms</text>
<rect x="740" y="325" width="200" height="73" rx="9" fill="#FDF1DC" stroke="#C98A1B" stroke-width="1.8"/>
<text x="840.0" y="345" text-anchor="middle" font-size="13" font-weight="bold" fill="#1F2937">results.out</text>
<text x="840.0" y="362" text-anchor="middle" font-size="13" fill="#1F2937">docno + score,</text>
<text x="840.0" y="379" text-anchor="middle" font-size="13" fill="#1F2937">best first</text>
<text x="20" y="52" text-anchor="start" font-size="13" fill="#444">Build the index (run once)</text>
<text x="20" y="300" text-anchor="start" font-size="13" fill="#444">Answer a query (run per query)</text>
</svg>